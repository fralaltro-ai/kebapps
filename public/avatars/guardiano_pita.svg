<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background Circle Soft Emerald/Mint -->
  <circle cx="60" cy="60" r="56" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4" />
  
  <!-- Fresh Mint Leaf on Top -->
  <path d="M60 18 C70 16, 76 26, 68 32 C60 38, 56 26, 60 18 Z" fill="#22C55E" />
  
  <!-- Face/Body (Warm Pita Pocket) -->
  <ellipse cx="60" cy="66" rx="34" ry="32" fill="#FED7AA" stroke="#F97316" stroke-width="3.5" />
  
  <!-- Pita Fold Pocket Wrap -->
  <path d="M30 62 C34 94, 86 94, 90 62 C78 74, 42 74, 30 62 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="2.5" />
  
  <!-- Eyes -->
  <circle cx="48" cy="58" r="3.5" fill="#431407" />
  <circle cx="72" cy="58" r="3.5" fill="#431407" />
  <circle cx="49.5" cy="56.5" r="1.2" fill="#FFFFFF" />
  <circle cx="73.5" cy="56.5" r="1.2" fill="#FFFFFF" />
  
  <!-- Cheeks -->
  <circle cx="41" cy="65" r="4" fill="#FDBA74" opacity="0.8" />
  <circle cx="79" cy="65" r="4" fill="#FDBA74" opacity="0.8" />
  
  <!-- Happy Guardian Smile -->
  <path d="M53 68 Q60 74 67 68" fill="none" stroke="#431407" stroke-width="2.5" stroke-linecap="round" />
</svg>
